name: Aggiorna stato e pubblica

on:
  schedule:
    - cron: "17 */3 * * *"   # ogni 3 ore, al minuto 17
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/status.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raccogli dati
        run: python scripts/update_status.py

      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "Aggiorna stato coda $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Prepara il sito
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/status.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
