name: Aggiorna stato e pubblica

on:
  schedule:
    # GitHub ritarda o salta spesso le esecuzioni programmate: ogni ora, così
    # anche saltandone qualcuna i dati non restano vecchi di molte ore.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/status.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raccogli dati
        run: python scripts/update_status.py

      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Salva solo se è cambiato qualcosa oltre agli orari di aggiornamento
          # (il sito pubblicato riceve comunque il file nuovo).
          if python scripts/same_data.py <(git show HEAD:data/status.json) data/status.json; then
            echo "Nessun cambiamento nei dati"
            exit 0
          fi
          git add data/status.json
          git commit -m "Aggiorna stato coda $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Un'altra esecuzione può aver salvato nel frattempo: riallinea e riprova.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git checkout --theirs data/status.json 2>/dev/null; git add data/status.json; GIT_EDITOR=true git rebase --continue; }
            sleep 5
          done
          echo "::warning::Dati non salvati nel repository dopo 3 tentativi; il sito viene pubblicato lo stesso"

      - name: Prepara il sito
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/status.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
